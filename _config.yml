# _config.yml
title: "ISDY — Институт социальной динамики и управления"
email: "info@isdy.ru"
description: >-
  Академические исследования социологии управления,
  социального планирования и оценки эффективности управленческих решений.
baseurl: ""
url: "https://isdy.ru"
future: true

# Красивые URL статей
permalink: /research/:title/

# Плагины GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# SEO-теги
lang: ru_RU

# Настройки по умолчанию
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "article"

# Исключения
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
